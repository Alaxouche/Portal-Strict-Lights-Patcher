; ============================================================================
; Portal Lights Runtime Patcher
; ============================================================================
; Place next to the DLL: Data/SKSE/Plugins/PortalLightsRuntimePatcher.ini
;
; Gives Portal-strict to placed light bulbs only, at the moment the engine
; builds each one. Spell lights, equipped torches, hazard lights and menu
; lights are left alone on purpose: they are temporary lights that travel with
; whatever carries them, and restricting them to a room makes no sense.
;
; That split is structural: those lights are built by engine call sites this
; plugin does not hook. ExcludeMagicLights below is a second line of defence
; for the one path where a magic light can still reach a reference.
;
; Nothing is written to any record permanently. The flag is set for the
; duration of one engine call and put straight back, so a LIGH form that is
; also used as a torch or a spell light is never contaminated.
;
; This file is rewritten on every game start: missing keys are added back with
; their comments, so it is always complete.
; ============================================================================

[Filters]

;OFF by default: the entry points this plugin hooks are only reached for placed
;references, so spell lights, equipped torches and hazards are already excluded
;without any name matching.
;Turn on to additionally drop any light whose EditorID contains the word magic.
;That only changes anything for a magic record placed in a cell as an ordinary
;reference, which is rare.
;REQUIRES powerofthree Tweaks: without po3_Tweaks.dll no light has a readable
;EditorID at runtime and this filter cannot test anything. The log says so once,
;with a count, rather than failing quietly.
ExcludeMagicLights = false

;OFF by default: spotlights get Portal-strict like every other reference light.
;Turn on to leave them alone (Spot Light / Spot Shadow flags).
;Portal-strict on a spot can drop culled-but-visible cones.
ExcludeSpotLights = false


[Log]

;Write PortalLightsRuntimePatcher.log to
;Documents/My Games/Skyrim Special Edition/SKSE/.
EnableLogging = true

;1=error 2=warn 3=info 4=debug 5=trace.
;Level 4 logs one line per light the audit walks.
LogLevel = 3


[Debug]

;DISABLED by default (0). Set a DirectX scan code to audit the lights currently
;live in the renderer and show the result on screen.
;87 = 0x57 = F11 is a good choice. Alternatives: 88 (F12), 68 (F10),
;210 (Insert), 209 (Page Down).
;This reads BSLight::portalStrict inside the ShadowSceneNode, i.e. the value the
;portal culling actually uses -- not anything this plugin wrote. Stand in a lit
;interior and press it. See DisableHooks below: one run on its own proves
;nothing, it has to be compared against a baseline.
AuditHotkey = 0

;Baseline switch. ON installs nothing at all, so an audit shows what the load
;order already had. Run once with this ON and once OFF from the same save: if
;the numbers are identical, the audit is measuring nothing and the result is
;worthless either way.
DisableHooks = false

;Dump this many lights per audit with every field the classification and the
;portalStrict read depend on: the neighbouring booleans, luminance, room and
;portal counts, the owning reference and its base form type. 0 is off.
;Use it when a count looks impossible rather than trusting it.
DiagnoseLights = 0
