; ============================================================================
; Portal Lights Runtime Patcher
; ============================================================================
; Place next to the DLL: Data/SKSE/Plugins/PortalLightsRuntimePatcher.ini
;
; Gives Portal-strict to placed light bulbs, at the moment the engine builds
; each one, and to the records Light Placer configs name, at load. Spell lights,
; equipped torches, hazard lights and menu lights are left alone: they are
; temporary lights that travel with whatever carries them, and confining one to
; a room makes no sense. That split is structural, not a setting: those lights
; are built by engine entry points this plugin does not hook.
;
; The filters below are choices on top of that. Shadow casters, spotlights and
; carriable lights are excluded by default because portal-strict visibly breaks
; them; the magic filter catches a magic record placed in a cell as an ordinary
; reference; exteriors are patched because the flag lives on the record and
; cannot be scoped to one cell anyway.
;
; The flag is set just before the engine builds the light and is left in place,
; exactly like the xEdit script this replaces. An earlier build put it back
; afterwards; the record then disagreed with the light that had been built from
; it, and the engine crashed tearing that light down.
;
; This file is rewritten on every game start: missing keys are added back with
; their comments, so it is always complete.
; ============================================================================

[Filters]

;ON by default: any light whose EditorID contains the word magic is left alone.
;Real spell lights never reach this plugin anyway, so this only covers a magic
;record that was placed in a cell as an ordinary reference.
;Turn off to treat those like any other placed light.
;REQUIRES powerofthree Tweaks: without po3_Tweaks.dll no light has a readable
;EditorID at runtime and this filter cannot test anything, so nothing gets
;excluded. The audit says so with a count rather than failing quietly.
ExcludeMagicLights = true

;ON by default: spotlights are left alone (Spot Light / Spot Shadow flags).
;Portal-strict on a spot can drop a cone that should still be visible.
;Turn off to give them the flag like every other placed light.
ExcludeSpotLights = true

;ON by default: shadow-casting lights are left alone (Hemi/Omni/Spot Shadow).
;Lighting overhauls such as ELFX Shadows and Lux use long-range shadow lights
;placed OUTSIDE the room bounds on purpose, so they can throw window shadows
;inward. Confining one to a room stops those shadows working.
;Reported by nicola89b, co-author of ELFX Shadows. Turn off only if you know
;your lighting mod does not rely on them.
ExcludeShadowLights = true

;ON by default: lights the player or an NPC can pick up are left alone.
;A carriable light travels through doorways in someone hand, torches above
;all. The flag lives on the record, and a torch lying on a dungeon floor uses
;the same DefaultTorch01 record as every carried torch: flag it there and every
;torch in the game stops lighting the next room. Turn off only if you know
;what you are doing.
ExcludeCarriedLights = true

;ON by default: exterior cells are patched like interiors.
;Room bounds and portals only exist indoors, so the flag has nothing to cull
;against outside one. It is set anyway for two reasons: the xEdit script this
;plugin replaces has always flagged every record regardless of where it is used,
;and the flag lives on the record, so a form first seen in an interior carries it
;outdoors whatever this setting says.
;Turn off to skip lights whose reference sits in an exterior cell. That narrows
;exposure but cannot unflag a record already caught indoors.
PatchExteriors = true


[LightPlacer]

;ON by default: records named by Light Placer configs get the flag too.
;Light Placer builds its own lights from the JSON files under Data/LightPlacer,
;each entry naming a LIGH record by EditorID, and makes a light portal-strict
;when its entry says PortalStrict OR the record carries the flag. Those lights
;never pass through the engine entry points this plugin hooks, so this pass
;reads the configs at load and flags the records they name, before any light
;is built. Entries already marked PortalStrict are left to Light Placer.
;The same filters apply: carried, shadow (form flags or Shadow in the entry),
;spot and magic. Note that many configs reuse MagicLightWhite01 and similar
;records as generic bulbs: with ExcludeMagicLights on those are skipped here.
PatchLightPlacer = true


[Log]

;Write PortalLightsRuntimePatcher.log to
;Documents/My Games/Skyrim Special Edition/SKSE/.
EnableLogging = true

;1=error 2=warn 3=info 4=debug 5=trace.
;Level 4 logs one line per light the audit walks.
LogLevel = 3


[Debug]

;DISABLED by default (0). Set a DirectX scan code to audit the lights currently
;live in the renderer and show the result on screen.
;87 = 0x57 = F11 is a good choice. Alternatives: 88 (F12), 68 (F10),
;210 (Insert), 209 (Page Down).
;This reads BSLight::portalStrict inside the ShadowSceneNode, i.e. the value the
;portal culling actually uses -- not anything this plugin wrote. Stand in a lit
;interior and press it. See DisableHooks below: one run on its own proves
;nothing, it has to be compared against a baseline.
AuditHotkey = 0

;Baseline switch. ON installs nothing at all, so an audit shows what the load
;order already had. Run once with this ON and once OFF from the same save: if
;the numbers are identical, the audit is measuring nothing and the result is
;worthless either way.
DisableHooks = false

;Dump this many lights per audit with every field the classification and the
;portalStrict read depend on: the neighbouring booleans, luminance, room and
;portal counts, the owning reference and its base form type. 0 is off.
;Use it when a count looks impossible rather than trusting it.
DiagnoseLights = 0
