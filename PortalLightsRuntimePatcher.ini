; ============================================================================
; Portal Lights Runtime Patcher
; ============================================================================
; Place next to the DLL: Data/SKSE/Plugins/PortalLightsRuntimePatcher.ini
;
; Sets Portal-strict on every LIGH form in the load order, at runtime, once,
; when SKSE reports kDataLoaded. Same effect as an xEdit override plugin, with
; no ESP and no conflicts to resolve.
;
; Both places the Creation Kit writes the flag are set:
;   DATA\Flags\Portal-strict                 (1 << 13)  - the functional one
;   Record Header\Record Flags\Portal-strict (1 << 17)  - CK parity
;
; Out of the box nothing is excluded: every light gets the flag. The two
; filters below are there for tuning if a specific light type misbehaves.
;
; This file is rewritten on every game start: missing keys are added back with
; their comments, so it is always complete.
; ============================================================================

[Filters]

;OFF by default: every light is patched, magic ones included.
;Turn on to leave magic lights alone (EditorID contains "magic").
;Those follow actors across room bounds, which is the case where
;portal-strict is most debatable.
;REQUIRES powerofthree's Tweaks: without po3_Tweaks.dll no light has
;a readable EditorID at runtime and this filter silently does nothing.
;The log says so explicitly when that happens.
ExcludeMagicLights = false

;OFF by default: spotlights are patched like everything else.
;Turn on to leave them alone (Spot Light / Spot Shadow flags).
;Portal-strict on a spot can drop culled-but-visible cones.
ExcludeSpotLights = false


[Log]

;Write PortalLightsRuntimePatcher.log to
;Documents/My Games/Skyrim Special Edition/SKSE/.
EnableLogging = true

;1=error 2=warn 3=info 4=debug 5=trace.
;Level 4 logs one line per patched light, which is thousands of lines.
LogLevel = 3
